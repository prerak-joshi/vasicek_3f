site_name: vasicek3f
site_description: Three-factor Gaussian Vasicek term structure model with Kalman-filter MLE and term premium decomposition
site_author: Prerak Joshi
site_url: https://prerak-joshi.github.io/vasicek_3f/
repo_url: https://github.com/prerak-joshi/vasicek_3f
repo_name: prerak-joshi/vasicek_3f
edit_uri: edit/main/docs/
copyright: "© 2026 Prerak Joshi · MIT licence · Educational project, not investment advice"

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Methodology:
      - Model, estimation and extensions: methodology.md
      - Interpreting the term premium: term-premium.md
      - Validation: validation.md
  - Dashboard: dashboard.md
  - Developer:
      - Architecture: architecture.md
      - API reference: api.md
  - FAQ: faq.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_toc_entry: false
            members_order: source
            heading_level: 3
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/prerak-joshi/vasicek_3f
